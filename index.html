<!-- Estilização do Botão (Cole dentro da tag <head> ou no início do body) -->
<style>
    /* Estilo Base do Botão de Música */
    .btn-musica-container {
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 20px 0;
    }

    .btn-musica {
        background: linear-gradient(135deg, #2b2e4a, #e84545); /* Gradiente moderno */
        color: #ffffff;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 1px;
        padding: 12px 30px;
        border: none;
        border-radius: 50px; /* Bordas arredondadas elegantes */
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(232, 69, 69, 0.4); /* Sombra suave */
        transition: all 0.3s ease; /* Transição para efeitos */
        outline: none;
        display: inline-flex;
        align-items: center;
        gap: 10px;
    }

    /* Efeito ao passar o mouse (Hover) */
    .btn-musica:hover {
        transform: translateY(-3px); /* Levanta levemente o botão */
        box-shadow: 0 6px 20px rgba(232, 69, 69, 0.6); /* Intensifica a sombra */
        background: linear-gradient(135deg, #3f446e, #ff5252); /* Muda o tom do gradiente */
    }

    /* Efeito ao clicar (Active) */
    .btn-musica:active {
        transform: translateY(1px); /* Abaixa ao clique simulando um botão físico */
    }
</style>

<!-- Estrutura HTML -->
<audio id="minhaMusica">
    <source src="rodo-cotidiano.mpeg" type="audio/mpeg">
    Seu navegador não suporta o elemento de áudio.
</audio>

<div class="btn-musica-container">
    <button onclick="controlarMusica()" id="btnMusica" class="btn-musica">
        <span id="iconeBtn">▶</span> 
        <span id="textoBtn">TOCAR MÚSICA</span>
    </button>
</div>

<!-- Lógica JavaScript Atualizada -->
<script>
    const musica = document.getElementById('minhaMusica');
    const icone = document.getElementById('iconeBtn');
    const texto = document.getElementById('textoBtn');

    function controlarMusica() {
        if (musica.paused) {
            musica.play();
            icone.innerHTML = "⏸";
            texto.innerHTML = "PAUSAR";
        } else {
            musica.pause();
            icone.innerHTML = "▶";
            texto.innerHTML = "TOCAR MÚSICA";
        }
    }
</script>
